<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Quest - Robot Fixed Rotation</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #05070f;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      #hint-box {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #00ffcc;
        background: rgba(10, 14, 26, 0.9);
        border: 1px solid #00ffcc;
        box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
        padding: 14px 20px;
        border-radius: 10px;
        pointer-events: none;
        display: none;
        font-size: 14px;
        z-index: 10;
      }
      #controls-prompt {
        position: absolute;
        bottom: 15px;
        left: 20px;
        color: rgba(255, 255, 255, 0.5);
        font-size: 12px;
        pointer-events: none;
      }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GLTF Model Loader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  </head>
  <body>
    <div id="hint-box">
      🕹️ <b>Secret Protocol:</b><br />
      1. Press <b>SPACE</b> twice<br />
      2. Hold <b>SHIFT</b> to Super Jump!<br />
      3. Press <b>R</b> to Reset Box & Banner!<br />
      <small
        >Space Count: <span id="space-count">0</span> | Shift:
        <span id="shift-status">OFF</span></small
      >
    </div>

    <div id="controls-prompt">Press [ V ] for Hints | Press [ R ] to Reset</div>

    <script>
      // 1. Scene & Camera Setup
      const scene = new THREE.Scene();
      const clock = new THREE.Clock();

      const camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 2.8, 8.5);
      camera.lookAt(0, 2.8, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      // 2. Ambient Dark Glow Background
      const bgGeo = new THREE.PlaneGeometry(30, 20);
      const bgCanvas = document.createElement("canvas");
      bgCanvas.width = 512;
      bgCanvas.height = 512;
      const bgCtx = bgCanvas.getContext("2d");
      const bgGlow = bgCtx.createRadialGradient(256, 256, 10, 256, 256, 250);
      bgGlow.addColorStop(0, "#1a1f3d");
      bgGlow.addColorStop(0.5, "#0b0e1e");
      bgGlow.addColorStop(1, "#030408");
      bgCtx.fillStyle = bgGlow;
      bgCtx.fillRect(0, 0, 512, 512);

      const bgTexture = new THREE.CanvasTexture(bgCanvas);
      const backgroundMesh = new THREE.Mesh(
        bgGeo,
        new THREE.MeshBasicMaterial({ map: bgTexture }),
      );
      backgroundMesh.position.set(0, 5, -8);
      scene.add(backgroundMesh);

      // 3. Lighting Setup
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      const mainLight = new THREE.PointLight(0xffaa00, 2, 15);
      mainLight.position.set(0, 5, 3);
      scene.add(mainLight);

      const blueRim = new THREE.DirectionalLight(0x00d2ff, 0.9);
      blueRim.position.set(-4, 6, 2);
      scene.add(blueRim);

      // 4. Ombre Base Floor
      const floorGeo = new THREE.PlaneGeometry(16, 16);
      const floorCanvas = document.createElement("canvas");
      floorCanvas.width = 512;
      floorCanvas.height = 512;
      const fCtx = floorCanvas.getContext("2d");

      const floorGrad = fCtx.createRadialGradient(256, 256, 0, 256, 256, 256);
      floorGrad.addColorStop(0, "#00ffcc");
      floorGrad.addColorStop(0.3, "#0d3b66");
      floorGrad.addColorStop(0.8, "#0d1117");
      floorGrad.addColorStop(1, "#05070f");
      fCtx.fillStyle = floorGrad;
      fCtx.fillRect(0, 0, 512, 512);

      const floorTexture = new THREE.CanvasTexture(floorCanvas);
      const floorMat = new THREE.MeshStandardMaterial({
        map: floorTexture,
        roughness: 0.4,
        metalness: 0.1,
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0;
      scene.add(floor);

      // 5. Question Block
      const cubeGeo = new THREE.BoxGeometry(1.1, 1.1, 1.1);
      const activeBlockColor = 0xffaa00;
      const usedBlockColor = 0x444455;

      const cubeMat = new THREE.MeshStandardMaterial({
        color: activeBlockColor,
        roughness: 0.2,
        metalness: 0.4,
        emissive: 0x442200,
      });
      const questionBlock = new THREE.Mesh(cubeGeo, cubeMat);
      questionBlock.position.set(0, 2.8, 0);
      scene.add(questionBlock);

      // 6. ROBOT MODEL LOADING (GLTF)
      const characterGroup = new THREE.Group();
      scene.add(characterGroup);
      let mixer = null;

      const loader = new THREE.GLTFLoader();

      const modelUrl =
        "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/RobotExpressive/RobotExpressive.glb";

      loader.load(modelUrl, (gltf) => {
        const robot = gltf.scene;
        robot.scale.set(0.35, 0.35, 0.35);
        robot.position.set(0, 0, 0);

        // 🔄 ROTATION FIX: Model face flipped by 180 degrees (Math.PI)
        robot.rotation.y = Math.PI;

        characterGroup.add(robot);

        // Setup Animation
        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(robot);
          const runClip =
            THREE.AnimationClip.findByName(gltf.animations, "Running") ||
            gltf.animations[0];
          if (runClip) {
            const action = mixer.clipAction(runClip);
            action.play();
          }
        }
      });

      // 7. High-Res Secret Banner
      function createHighResBanner(text) {
        const canvas = document.createElement("canvas");
        canvas.width = 1024;
        canvas.height = 512;
        const ctx = canvas.getContext("2d");

        ctx.fillStyle = "#0d1322";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.lineWidth = 14;
        ctx.strokeStyle = "#00ffcc";
        ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

        ctx.lineWidth = 6;
        ctx.strokeStyle = "#ffaa00";
        ctx.strokeRect(25, 25, canvas.width - 50, canvas.height - 50);

        ctx.fillStyle = "#ffffff";
        ctx.font = "900 52px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("⚡ SECRET UNLOCKED ⚡", canvas.width / 2, 130);

        ctx.fillStyle = "#00ffcc";
        ctx.font = "Bold 42px Arial, sans-serif";
        ctx.fillText(text, canvas.width / 2, 260);

        ctx.fillStyle = "#ffaa00";
        ctx.font = "32px Arial, sans-serif";
        ctx.fillText("🤫 Only You & Me Know This!", canvas.width / 2, 370);

        const texture = new THREE.CanvasTexture(canvas);
        const bannerGeo = new THREE.PlaneGeometry(3.6, 1.8);
        const bannerMat = new THREE.MeshBasicMaterial({
          map: texture,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0,
        });

        const mesh = new THREE.Mesh(bannerGeo, bannerMat);
        mesh.position.set(0, 2.8, 0);
        return mesh;
      }

      let secretBanner = createHighResBanner("MISSION ACCOMPLISHED");
      scene.add(secretBanner);

      // 8. Game Mechanics & Controls
      let spacePresses = 0;
      let isShiftPressed = false;
      let isJumping = false;
      let jumpProgress = 0;
      let angle = 0;
      let isBannerRevealed = false;

      const hintBox = document.getElementById("hint-box");
      const spaceCountUI = document.getElementById("space-count");
      const shiftStatusUI = document.getElementById("shift-status");

      function resetScene() {
        isBannerRevealed = false;
        isJumping = false;
        spacePresses = 0;
        spaceCountUI.innerText = 0;

        questionBlock.position.set(0, 2.8, 0);
        questionBlock.material.color.setHex(activeBlockColor);
        questionBlock.material.emissive.setHex(0x442200);

        secretBanner.position.set(0, 2.8, 0);
        secretBanner.material.opacity = 0;

        characterGroup.position.set(0, 0, 0);
      }

      window.addEventListener("keydown", (e) => {
        if (e.key === "v" || e.key === "V") {
          hintBox.style.display =
            hintBox.style.display === "none" || hintBox.style.display === ""
              ? "block"
              : "none";
        }
        if (e.key === "r" || e.key === "R") {
          resetScene();
        }
        if (e.code === "Space") {
          spacePresses++;
          spaceCountUI.innerText = spacePresses;
        }
        if (e.key === "Shift") {
          isShiftPressed = true;
          shiftStatusUI.innerText = "ON";
        }

        if (spacePresses >= 2 && isShiftPressed && !isJumping) {
          isJumping = true;
          jumpProgress = 0;
          spacePresses = 0;
          spaceCountUI.innerText = 0;
        }
      });

      window.addEventListener("keyup", (e) => {
        if (e.key === "Shift") {
          isShiftPressed = false;
          shiftStatusUI.innerText = "OFF";
        }
      });

      // 9. Main Render Loop
      function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();

        if (mixer) {
          mixer.update(delta);
        }

        // Patrol Orbit - Face forward along tangential vector
        if (!isJumping) {
          angle += 0.025;
          characterGroup.position.x = Math.cos(angle) * 1.8;
          characterGroup.position.z = Math.sin(angle) * 1.8;

          // 🔄 Correct Face Facing Angle
          characterGroup.rotation.y = -angle - Math.PI / 2;
        } else {
          jumpProgress += 0.04;

          characterGroup.position.x += (0 - characterGroup.position.x) * 0.15;
          characterGroup.position.z += (0 - characterGroup.position.z) * 0.15;

          const jumpHeight = Math.sin(jumpProgress * Math.PI) * 2.6;
          characterGroup.position.y = jumpHeight;

          if (jumpProgress >= 0.48 && characterGroup.position.y >= 2.0) {
            questionBlock.position.y = 3.1;
            questionBlock.material.color.setHex(usedBlockColor);
            questionBlock.material.emissive.setHex(0x000000);
            isBannerRevealed = true;
          }

          if (jumpProgress >= 1) {
            isJumping = false;
            characterGroup.position.y = 0;
            questionBlock.position.y = 2.8;
          }
        }

        if (isBannerRevealed) {
          if (secretBanner.position.y < 4.8) {
            secretBanner.position.y += 0.05;
          }
          if (secretBanner.material.opacity < 1) {
            secretBanner.material.opacity += 0.08;
          }
          secretBanner.position.y += Math.sin(Date.now() * 0.003) * 0.002;
          secretBanner.rotation.y = Math.sin(Date.now() * 0.001) * 0.05;
        }

        questionBlock.rotation.y += 0.01;

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
